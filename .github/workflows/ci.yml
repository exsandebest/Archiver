name: CI

on:
  push:
    branches: [ master ]
  pull_request:

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qt5-qmake qtbase5-dev qtdeclarative5-dev qttools5-dev qttools5-dev-tools cppcheck

      - name: Cppcheck
        run: cppcheck --enable=warning --error-exitcode=1 --suppress=missingIncludeSystem --std=c++11 --template='{file}:{line}:{severity}:{id}:{message}' archiver.cpp archiver.h Node.h main.cpp mainwindow.cpp mainwindow.h test.cpp test.h

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qt5-qmake qtbase5-dev qtdeclarative5-dev qttools5-dev qttools5-dev-tools

      - name: Configure
        run: qmake Archiver.pro

      - name: Build
        run: make -j2

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qt5-qmake qtbase5-dev qtdeclarative5-dev qttools5-dev qttools5-dev-tools

      - name: Configure
        run: qmake Archiver.pro

      - name: Build
        run: make -j2

      - name: Run tests
        run: ./Archiver --test
